<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Images in this session</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f6f4; --line: #e2e2de; --text: #1f1f1d; --muted: #6b6b66;
    --accent: #c15f3c; --accent-text: #ffffff; --row-hover: #efeeea; --row-sel: #f3e3db; --checker-a: #ececea; --checker-b: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #1b1b1a; --panel: #232322; --line: #373735; --text: #ececea; --muted: #9a9a94;
    --accent: #d9774f; --accent-text: #1b1b1a; --row-hover: #2b2b29; --row-sel: #3a2c25; --checker-a: #2a2a28; --checker-b: #222221;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1b1a; --panel: #232322; --line: #373735; --text: #ececea; --muted: #9a9a94;
      --accent: #d9774f; --accent-text: #1b1b1a; --row-hover: #2b2b29; --row-sel: #3a2c25; --checker-a: #2a2a28; --checker-b: #222221;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
  select, input, button { font: inherit; color: var(--text); }
  select, input[type="search"] { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--row-hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  button.active { background: var(--row-sel); border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 38%) 1fr; }
  #master { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #search { margin: 10px 12px; }
  #rows { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  td.num, th.num { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr[aria-selected="true"] { background: var(--row-sel); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  #empty { padding: 28px 16px; color: var(--muted); text-align: center; }
  #detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: center; }
  #bar .spacer { flex: 1; }
  #stage { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 16px;
    background-image: linear-gradient(45deg, var(--checker-a) 25%, transparent 25%, transparent 75%, var(--checker-a) 75%), linear-gradient(45deg, var(--checker-a) 25%, var(--checker-b) 25%, var(--checker-b) 75%, var(--checker-a) 75%);
    background-size: 20px 20px; background-position: 0 0, 10px 10px; }
  #stage img { margin: auto; display: block; border-radius: 4px; box-shadow: 0 1px 8px rgba(0,0,0,.25); background: var(--bg); }
  #stage.fit img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #stage.actual { display: block; }
  #stage.actual img { margin: 0; }
  #meta { padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 13px; }
  #meta dt { color: var(--muted); }
  #meta dd { margin: 0; overflow-wrap: anywhere; user-select: text; }
  #meta dd.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  #placeholder { margin: auto; color: var(--muted); }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .15s; pointer-events: none; }
  #toast.show { opacity: .95; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; } #master { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
<!-- The window's theme (data-theme), Refresh and selection: browser-pane's client. -->
<script src="/bp/client.js"></script>
</head>
<body>
<header>
  <h1>Images in this session</h1>
</header>
<main>
  <section id="master" aria-label="Images">
    <input id="search" type="search" placeholder="Filter by number or name" aria-label="Filter images">
    <div id="rows">
      <table>
        <thead><tr><th class="num">#</th><th>Name</th><th class="num">Size</th><th>Source</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
      <div id="empty" hidden></div>
    </div>
  </section>
  <section id="detail" aria-label="Preview">
    <div id="bar">
      <button id="open" class="primary" disabled>Open</button>
      <button id="reveal" disabled>Show in file manager</button>
      <button id="copy" disabled>Copy path</button>
      <span class="spacer"></span>
      <button id="fit" class="active" disabled>Fit</button>
      <button id="actual" disabled>100%</button>
    </div>
    <div id="stage" class="fit"><div id="placeholder">Select an image</div></div>
    <dl id="meta" hidden>
      <dt>Image</dt><dd id="m-n"></dd>
      <dt>File</dt><dd id="m-name"></dd>
      <dt>Path</dt><dd id="m-path" class="path"></dd>
      <dt>Details</dt><dd id="m-info"></dd>
    </dl>
  </section>
</main>
<div id="toast" role="status"></div>
<script>
const $ = id => document.getElementById(id)
const state = { images: [], selected: null, platform: '', query: '', first: true, wantN: 0 }

const fmtSize = n => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`)
// The tab's server module answers under api/; the window's cookie authenticates it.
const api = (path, init) => browserPane.api(path, init)
const post = (path, body) => api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json())

function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show')
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 1800)
}

const current = () => state.images.find(i => i.n === state.selected)
const visible = () => {
  const q = state.query.trim().toLowerCase()
  return q ? state.images.filter(i => String(i.n).includes(q) || i.name.toLowerCase().includes(q)) : state.images
}

function labels() {
  const p = state.platform
  $('open').textContent = p === 'darwin' ? 'Open in Preview' : 'Open in default app'
  $('reveal').textContent = p === 'darwin' ? 'Show in Finder' : p === 'win32' ? 'Show in Explorer' : 'Show in file manager'
}

function renderRows() {
  const body = $('body'); body.textContent = ''
  const rows = visible()
  for (const i of rows) {
    const tr = document.createElement('tr')
    tr.dataset.n = i.n; tr.tabIndex = -1
    tr.setAttribute('aria-selected', String(i.n === state.selected))
    for (const [text, cls] of [[`#${i.n}`, 'num'], [i.name, ''], [fmtSize(i.size), 'num']]) {
      const td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; td.title = i.path; tr.append(td)
    }
    const src = document.createElement('td'); const tag = document.createElement('span')
    tag.className = 'tag'; tag.textContent = i.source === 'dropped' ? 'dropped file' : 'pasted'; src.append(tag); tr.append(src)
    tr.onclick = () => select(i.n)
    tr.ondblclick = () => openNative()
    body.append(tr)
  }
  const empty = $('empty')
  empty.hidden = rows.length > 0
  empty.textContent = state.images.length
    ? 'No image matches the filter.'
    : 'No images yet. Paste or drop an image into the prompt, then submit (or type a space after its tag).'
}

function renderDetail() {
  const i = current(), has = !!i
  for (const id of ['open', 'reveal', 'copy', 'fit', 'actual']) $(id).disabled = !has
  $('meta').hidden = !has
  const stage = $('stage')
  if (!has) { stage.innerHTML = '<div id="placeholder">Select an image</div>'; return }
  const src = `api/image/${i.n}?v=${Math.round(i.mtimeMs)}`
  let img = stage.querySelector('img')
  if (!img || img.dataset.src !== src) {
    stage.textContent = ''
    img = document.createElement('img'); img.dataset.src = src; img.alt = `Image #${i.n}`; img.src = src
    img.onload = () => { $('m-info').textContent = `${img.naturalWidth} × ${img.naturalHeight} px · ${fmtSize(i.size)} · ${i.mime} · ${new Date(i.mtimeMs).toLocaleString()}` }
    img.onerror = () => { stage.textContent = 'This image could not be shown here. Use the button to open it in the OS viewer.' }
    stage.append(img)
  }
  $('m-n').textContent = `#${i.n} (${i.source === 'dropped' ? 'a dropped file, shown from where it came from' : 'pasted, saved by Claude Code'})`
  $('m-name').textContent = i.name
  $('m-path').textContent = i.path
  if (img.complete && img.naturalWidth) $('m-info').textContent = `${img.naturalWidth} × ${img.naturalHeight} px · ${fmtSize(i.size)} · ${i.mime} · ${new Date(i.mtimeMs).toLocaleString()}`
}

function select(n) {
  state.selected = n
  for (const tr of $('body').children) {
    const on = Number(tr.dataset.n) === n
    tr.setAttribute('aria-selected', String(on))
    if (on) tr.scrollIntoView({ block: 'nearest' })
  }
  renderDetail()
}

async function openNative() {
  const i = current(); if (!i) return
  const r = await post('open', { n: i.n })
  toast(r.ok ? `Opened #${i.n} in the OS viewer` : 'Could not open it in the OS viewer')
}
async function reveal() {
  const i = current(); if (!i) return
  const r = await post('reveal', { n: i.n })
  toast(r.ok ? 'Shown in the file manager' : 'Could not show it in the file manager')
}
async function copyPath() {
  const i = current(); if (!i) return
  try { await navigator.clipboard.writeText(i.path); toast('Path copied') } catch { toast('Copy failed') }
}

$('open').onclick = openNative
$('reveal').onclick = reveal
$('copy').onclick = copyPath
$('fit').onclick = () => { $('stage').className = 'fit'; $('fit').classList.add('active'); $('actual').classList.remove('active') }
$('actual').onclick = () => { $('stage').className = 'actual'; $('actual').classList.add('active'); $('fit').classList.remove('active') }
$('search').oninput = e => { state.query = e.target.value; renderRows() }

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return
  const rows = visible(); if (!rows.length) return
  const at = rows.findIndex(i => i.n === state.selected)
  if (e.key === 'ArrowDown') { e.preventDefault(); select(rows[Math.min(rows.length - 1, at + 1)].n) }
  else if (e.key === 'ArrowUp') { e.preventDefault(); select(rows[Math.max(0, at - 1)].n) }
  else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); openNative() }
})

let lastJson = ''
async function refresh() {
  try {
    const r = await api('images'); const data = await r.json()
    const text = JSON.stringify(data)
    state.platform = data.platform; labels()
    if (text !== lastJson) {
      lastJson = text; state.images = data.images
      if (state.first && data.images.length) {
        state.first = false
        state.selected = data.images[data.images.length - 1].n
      }
      if (!data.images.some(i => i.n === state.selected)) state.selected = data.images.length ? data.images[data.images.length - 1].n : null
      renderRows(); renderDetail()
    }
    applyWant()
  } catch { /* the session ended; the window stays as it was */ }
}

// A chip click in Claude Code asks for an image; it may not be on the list yet, so it waits until it is.
function applyWant() {
  if (state.wantN && state.images.some(i => i.n === state.wantN)) { select(state.wantN); state.wantN = 0 }
}
browserPane.onSelect(n => { state.wantN = Number(n) || 0; state.first = false; refresh() })
browserPane.onRefresh(refresh)
refresh(); setInterval(refresh, 2000)
</script>
</body>
</html>
